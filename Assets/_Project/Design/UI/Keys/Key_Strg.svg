<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <!-- Outer key housing (wider) -->
  <rect x="6" y="6" width="288" height="188" rx="16" ry="16" fill="white" stroke="#1a1a1a" stroke-width="4"/>
  <!-- Corner connectors (3D depth lines) -->
  <line x1="22" y1="22" x2="30" y2="30" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="278" y1="22" x2="270" y2="30" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="22" y1="178" x2="30" y2="170" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="278" y1="178" x2="270" y2="170" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Side walls -->
  <line x1="30" y1="30" x2="30" y2="170" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="270" y1="30" x2="270" y2="170" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="30" y1="30" x2="270" y2="30" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="30" y1="170" x2="270" y2="170" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Keycap face -->
  <rect x="30" y="30" width="240" height="140" rx="8" ry="8" fill="white" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Label -->
  <text x="150" y="112" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Strg</text>
</svg>